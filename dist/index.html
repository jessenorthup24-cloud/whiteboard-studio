<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101b2d">
  <meta name="description" content="Create hand-drawn whiteboard videos in your browser.">
  <title>Whiteboard Studio</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✳</span><span>Whiteboard <b>Studio</b></span></div>
      <div class="project-heading"><input id="projectName" aria-label="Project name" value="Your first story"><span id="saveStatus">Saved locally</span></div>
      <div class="top-actions">
        <button id="projectsBtn" class="button ghost">My projects</button>
        <button id="previewBtn" class="button subtle">▶ <span>Preview</span></button>
        <button id="exportBtn" class="button primary">Export video ↗</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="leftbar">
        <div class="section-label">CREATE</div>
        <button class="tool active" data-tool="select"><span>↖</span><small>Select</small></button>
        <button class="tool" data-tool="text"><span>Ｔ</span><small>Text</small></button>
        <button class="tool" data-tool="icon"><span>✎</span><small>Drawings</small></button>
        <button class="tool" data-tool="shape"><span>▢</span><small>Shapes</small></button>
        <button class="tool" data-tool="upload"><span>⇧</span><small>Upload</small></button>
        <button class="tool" data-tool="camera"><span>▣</span><small>Camera</small></button>
        <button class="tool" data-tool="audio"><span>♫</span><small>Audio</small></button>
      </aside>

      <main class="main">
        <div class="stage-top">
          <div class="stage-title"><span class="eyebrow">SCENE <span id="sceneNumber">01</span></span><span id="sceneTitle">The big idea</span></div>
          <div class="stage-controls"><span id="formatLabel">16:9 · Landscape</span><button id="fitBtn" class="icon-button" title="Fit canvas">⌗</button></div>
        </div>
        <div id="canvasShell" class="canvas-shell">
          <svg id="stage" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" aria-label="Video canvas"></svg>
          <div id="emptyHint" class="empty-hint hidden">Choose a tool on the left to start your scene.</div>
        </div>
        <div class="stage-footer"><span><i class="status-dot"></i> <span id="modeLabel">Editing canvas</span></span><span>Drag objects to arrange your story</span></div>
      </main>

      <aside class="inspector" id="inspector"></aside>
    </div>

    <section class="timeline-area">
      <div class="timeline-header">
        <div class="timeline-title"><strong>Timeline</strong><span id="durationLabel">00:00</span></div>
        <div class="timeline-play"><button id="restartBtn" class="mini-button" title="Restart">↶</button><button id="playBtn" class="play-button" title="Play or pause">▶</button><span id="timeLabel">00:00 / 00:00</span></div>
        <div class="timeline-actions"><button id="addSceneBtn" class="button subtle small">+ Scene</button><button id="duplicateSceneBtn" class="button ghost small">Duplicate</button></div>
      </div>
      <div class="timeline-body"><div id="sceneStrip" class="scene-strip"></div><div class="tracks"><div class="track-label">DRAW ORDER <span>Drag to reorder</span></div><div id="itemStrip" class="item-strip"></div><div class="audio-track"><span>♫ AUDIO</span><span id="audioTrackLabel">Add narration or music from the Audio tool</span></div></div></div>
      <div class="scrub-row"><input id="scrubber" type="range" min="0" max="1000" value="0" aria-label="Video playhead"><span id="scrubPercent">0%</span></div>
    </section>
  </div>

  <input id="uploadInput" type="file" accept="image/png,image/jpeg,image/svg+xml" hidden>
  <input id="audioInput" type="file" accept="audio/*" hidden>
  <div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="./app.js"></script>
</body>
</html>
